<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darkroom">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Splat Darkroom</title>
<style>
:root{--bg:#0e0e0e;--panel:#171717;--line:#262626;--text:#d6d6d6;--dim:#8b8b8b;--faint:#5c5c5c;--bright:#f2f2f2;--accent:#e0563f;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
header{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px}
header .hb{height:34px;padding:0 12px;border-radius:17px;background:#232323;color:var(--text);font-weight:500;font-size:14px}
header .hb.accent{background:var(--accent);color:#fff}
header .hb:disabled{opacity:.35}
header .icon{width:34px;padding:0;font-size:18px}
#title{flex:1;text-align:center;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title b{color:var(--bright);font-weight:600}
#body{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{flex:1;position:relative;min-height:0;background:#090909;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#tag{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000b;color:#fff;font-size:12px;padding:4px 10px;border-radius:12px;opacity:0;transition:opacity .15s;pointer-events:none;letter-spacing:.04em}
#tag.on{opacity:1}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:30px}
#empty.off{display:none}
#empty .big{font-size:17px;color:var(--bright)}
#empty .hb{height:44px;padding:0 24px;border-radius:22px;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
#histo{position:absolute;right:10px;bottom:10px;width:120px;height:52px;border-radius:6px;background:#0008;pointer-events:none}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:10px;background:#000a;color:#ddd;font-size:14px;z-index:4}
#busy.on{display:flex}
.spin{width:18px;height:18px;border:2px solid #555;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#000d;color:#eee;padding:8px 14px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:5}
#toast.on{opacity:1}

#sheet{flex:none;background:var(--panel);border-top:1px solid var(--line);height:38vh;max-height:330px;min-height:210px;display:flex;flex-direction:column}
#pane{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 16px 10px}
.paneHead{display:flex;align-items:center;justify-content:space-between;color:var(--faint);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin:8px 0 4px}
.paneHead button{color:var(--dim);font-size:12px;letter-spacing:0;text-transform:none;padding:4px 0 4px 10px}
nav{flex:none;display:flex;border-top:1px solid var(--line);padding-bottom:var(--sb);background:#121212}
nav button{flex:1;height:50px;color:var(--faint);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button i{font-style:normal;font-size:17px;line-height:1}
nav button.on{color:var(--bright)}
nav button.on i{color:var(--accent)}

/* sliders */
.sl{padding:7px 0 3px}
.sl .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.sl .top span:last-child{color:var(--bright);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.sl.changed .top span:first-child{color:var(--bright)}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
.sl input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--trk,#333)}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#e8e8e8;margin-top:-9.5px;box-shadow:0 1px 4px #000a}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.row>label{width:72px;flex:none;font-size:13px}
.seg{flex:1;display:flex;background:#232323;border-radius:8px;padding:2px}
.seg button{flex:1;height:30px;border-radius:6px;font-size:12px;color:var(--dim)}
.seg button.on{background:#3d3d3d;color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px}
.sw{width:44px;height:26px;border-radius:13px;background:#3a3a3a;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.note{color:var(--faint);font-size:12px;margin:6px 0}

/* film strip */
.stocks{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.stocks::-webkit-scrollbar{display:none}
.grp{flex:none;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--faint);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:0 2px}
.card{flex:none;width:78px;scroll-snap-align:start;text-align:center}
.card .th{width:78px;height:96px;border-radius:6px;background:#222 center/cover no-repeat;border:2px solid transparent}
.card.on .th{border-color:var(--accent)}
.card .nm{font-size:11px;margin-top:5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .iso{font-size:10px;color:var(--faint)}
.desc{font-size:12px;color:var(--dim);margin:2px 0 6px;min-height:32px}
.desc b{color:var(--bright);font-weight:600}

/* presets */
.pnew{display:flex;gap:8px;padding:6px 0 10px}
.pnew input{flex:1;min-width:0;height:36px;border-radius:8px;border:1px solid #333;background:#0f0f0f;color:#fff;font:15px var(--sans);padding:0 10px;-webkit-user-select:text;user-select:text;outline:none}
.pnew button{height:36px;padding:0 14px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pc{position:relative;text-align:center}
.pc .th{height:110px;border-radius:6px;background:#222 center/cover no-repeat}
.pc .nm{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:12px;background:#c33;color:#fff;font-size:14px;display:none}
.editing .pc .del{display:block}

/* save sheet */
.modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:calc(var(--st) + 16px) 18px calc(var(--sb) + 18px)}
.modal.on{display:flex}
.modal img{max-width:100%;max-height:62vh;box-shadow:0 10px 40px #000;-webkit-touch-callout:default}
.modal p{color:var(--dim);font-size:12px;margin:0;text-align:center}
.modal .btns{display:flex;gap:10px;width:100%;max-width:420px}
.modal .btns button{flex:1;height:48px;border-radius:24px;background:#262626;font-weight:600;font-size:15px}
.modal .btns button.accent{background:var(--accent);color:#fff}
.opts{width:100%;max-width:420px}
/* ---- iPad: portrait = taller panel; landscape = Lightroom-style sidebar */
@media (min-width:700px){
  header{height:56px;padding:0 16px}
  #sheet{height:34vh;max-height:440px}
  .card{width:96px}.card .th{width:96px;height:120px}
  #histo{width:180px;height:72px}
  .plist{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .pc .th{height:140px}
}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  #body{flex-direction:row}
  #sheet{width:380px;height:auto;max-height:none;min-height:0;border-top:0;border-left:1px solid var(--line);order:2}
  #pane{padding:10px 18px 16px}
  nav{order:-1;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  #stage{order:1}
  .stocks{flex-wrap:wrap;overflow:visible;margin:0;padding:6px 0 10px;scroll-snap-type:none}
  .grp{writing-mode:horizontal-tb;transform:none;width:100%;text-align:left;padding:8px 0 0}
  .card{width:100px}.card .th{width:100px;height:120px}
  #sheet{padding-bottom:var(--sb)}
}
#cropOv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none}
.pbtn{height:34px;padding:0 12px;border-radius:8px;background:#2a2a2a;color:var(--bright);font-size:13px;flex:1}
.btnrow{display:flex;gap:8px;margin:8px 0}
.curveBox{width:100%;max-width:340px;margin:6px auto}
.curveBox canvas{display:block;border-radius:8px;touch-action:none}
.wheels{display:flex;gap:8px;justify-content:space-between;margin:8px 0}
.wheel{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wheel canvas{border-radius:50%;touch-action:none;box-shadow:0 0 0 1px #333}
.wheel>span{font-size:11px;color:var(--dim)}
.wheel .sl{width:100%}
.wheel .sl .top{display:none}
#tabs button{min-width:0}
.seg{overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:0 8px}
#sheet{position:relative}
#toolSheet{position:absolute;inset:0;background:var(--bg,#121212);z-index:5;display:none;flex-direction:column}
#toolSheet.on{display:flex}
.tsHead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;font-size:15px;font-weight:600}
.tsHead button{background:var(--accent,#e0533d);color:#fff;border-radius:16px;height:32px;padding:0 16px;font-size:14px;font-weight:600}
#tsBody{flex:1;overflow-y:auto;padding:0 16px 12px}
#tsBody .paneHead>span{display:none}
#tsBody .paneHead .secTog{margin-left:0}
.toolRow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#1f1f1f;border-radius:10px;padding:11px 14px;margin:10px 0;color:var(--text)}
.toolRow b{display:block;font-weight:500;font-size:14px}
.toolRow small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.toolRow.changed b{color:var(--bright)}
.toolRow i{font-style:normal;color:var(--dim);font-size:20px}
#zoomBar{position:absolute;left:10px;bottom:10px;display:flex;gap:4px;align-items:center;background:#000a;border-radius:16px;padding:3px}
#zoomBar button{height:26px;min-width:34px;border-radius:13px;font-size:12px;color:#ccc;padding:0 6px}
#zoomBar button.on{background:#ffffff26;color:#fff}
#zoomPct{display:none}
#cmpTag{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000b;color:#fff;font-size:11px;padding:4px 10px;border-radius:12px;pointer-events:none;display:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#cmpTag.on{display:block}
#btnAB.on{background:#ffffff2a;color:#fff}
.pc .ab{position:absolute;left:6px;bottom:30px;background:#000a;color:#fff;border-radius:10px;font-size:11px;padding:3px 7px}
.pc.cmp{outline:2px solid #8fb3ff;border-radius:10px}
.hb.icon#btnAB{font-size:12px;font-weight:600}
#tabs button{position:relative}
#tabs button.edited::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent,#e0533d)}
.curveBox{max-width:min(340px,30vh)!important}
.maskList{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:#1f1f1f}
.mrow.on{background:#2b3442}.mrow.off .mn{opacity:.45}
.mrow .mn{flex:1;font-size:14px}.mrow .mi{color:var(--dim)}
.mrow button{color:var(--dim);font-size:16px;padding:0 6px}
.msub{margin:6px 0 10px}
#wbPick.on{background:#3d4a5e}
.secTog{margin-left:8px;margin-right:auto;height:20px;min-width:36px;border-radius:10px;background:#2b2b2b;color:#ddd;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:0 8px}
.secTog.off{background:#e0533d33;color:#ff8a78}
.paneHead.secoff>span{opacity:.5}
.recipes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rcp{background:#232323;border-radius:16px;padding:7px 12px;font-size:12.5px;color:var(--text)}
.rcp:active{background:#3d4a5e}
.rgridm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}
.rtm{background:#1c1c1c;border-radius:6px;overflow:hidden;padding:0;text-align:left;color:var(--text)}
.rtm i{display:block;aspect-ratio:3/2;background:#111 center/cover no-repeat}
.rtm span{display:block;font-size:10.5px;padding:4px 5px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtm:active{outline:2px solid #6a9cf0}
.paneHead .dice{margin-left:auto;background:#3a3f4a;color:#fff;border-radius:12px;padding:4px 10px;font-size:12px}
.alayer{margin:4px 0 12px}
.ahead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8d8d8d;margin:8px 0 6px}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.atile{position:relative;aspect-ratio:3/2;border-radius:4px;overflow:hidden;background:#0d0d0d}
.atile img{width:100%;height:100%;object-fit:cover;display:block}
.atile span{display:none}
.atile.on{outline:2px solid #6a9cf0;outline-offset:-2px}
.atile.none{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#1a1a1a 0 6px,#151515 6px 12px)}
.atile.none span{display:block;font-size:11px;color:#aaa}
.actl{margin-top:8px}
#tabs button i{font-style:normal}
#tabs button{font-size:10.5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hb" id="btnOpen">Open</button>
    <button class="hb icon" id="btnUndo" title="Undo">↶</button>
    <div id="title"><b>Darkroom</b></div>
    <button class="hb icon" id="btnAB" title="Compare a saved version side by side">A|B</button>
    <button class="hb icon" id="btnCompare" title="Hold for original">◐</button>
    <button class="hb accent" id="btnSave" disabled>Save</button>
  </header>
  <div id="body">
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="cropOv"></canvas>
    <canvas id="histo"></canvas>
    <div id="tag">ORIGINAL</div>
    <div id="cmpTag"></div>
    <div id="zoomBar"><span id="zoomPct">Fit</span><button data-z="fit" class="on">Fit</button><button data-z="1">1×</button><button data-z="2">2×</button><button data-z="4">4×</button></div>
    <div id="empty"><div class="big">Film for your iPhone photos</div><div>Portra, Ektar, Tri-X, CineStill, Velvia and more —<br>simulated from manufacturer data.</div><button class="hb" id="emptyOpen">Choose a Photo</button></div>
    <div id="busy"><div class="spin"></div><span id="busyMsg"></span></div>
    <div id="toast"></div>
  </div>
  <div id="sheet"><div id="pane"></div>
    <div id="toolSheet"><div class="tsHead"><span id="tsTitle"></span><button id="tsDone">Done</button></div><div id="tsBody"></div></div>
    <nav id="tabs">
      <button data-t="film" class="on"><i>◉</i>Film</button>
      <button data-t="light"><i>☀︎</i>Light</button>
      <button data-t="color"><i>◑</i>Color</button>
      <button data-t="crop"><i>⌗</i>Crop</button>
      <button data-t="effects"><i>✦</i>Effects</button>
      <button data-t="studio"><i>✺</i>Studio</button>
      <button data-t="presets"><i>☰</i>Presets</button>
    </nav>
  </div>
  </div>
</div>
<div id="saveSheet" class="modal">
  <img id="saveImg" alt="">
  <p id="saveInfo"></p>
  <div class="btns"><button id="saveClose">Done</button><button class="accent" id="saveShare">Save to Photos</button></div>
  <p>Tip: you can also press and hold the image → Save to Photos.</p>
</div>
<input type="file" id="fileIn" accept="image/*" hidden>
<script src="js/glutil.js"></script>
<script src="js/engine.js"></script>
<script src="js/borders.js"></script>
<script src="js/ui.js"></script>
<script src="js/tools.js"></script>
<script src="js/studio.js"></script>
<script src="js/mobile.js"></script>
</body>
</html>
